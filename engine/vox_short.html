<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Archivo:wght@700;800&family=Inter:wght@600;700&family=Caveat:wght@700&family=Permanent+Marker&display=swap">
<style>
html,body{margin:0;background:#000}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#E9E2D2}
.sc{position:absolute;inset:0;overflow:hidden}
.paper{position:absolute;inset:-40px;background:#ECE5D5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' seed='5'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .4 0 0 0 0 .32 0 0 0 .35 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.ht{position:absolute;overflow:hidden;isolation:isolate}
.ht img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.35) brightness(1.05);display:block}
.ht::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(0,0,0,.55) 38%,rgba(0,0,0,0) 42%);background-size:7px 7px;mix-blend-mode:multiply;opacity:.55}
.duo-azul::before,.duo-sepia::before,.duo-verm::before{content:"";position:absolute;inset:0;z-index:1;mix-blend-mode:screen}
.duo-azul::before{background:#3E6E9C}.duo-sepia::before{background:#7A5230}.duo-verm::before{background:#8C2A22}
.duo-azul img,.duo-sepia img,.duo-verm img{filter:grayscale(1) contrast(1.4) brightness(.9)}
.torn{clip-path:polygon(0 2%,5% 0,12% 1.5%,20% 0,31% 1.2%,44% 0,57% 1.4%,70% 0,83% 1.3%,94% 0,100% 1.5%,100% 97%,93% 100%,82% 98.5%,70% 100%,57% 98.6%,44% 100%,31% 98.4%,18% 100%,7% 98.6%,0 100%)}
.cut{position:absolute;filter:drop-shadow(0 0 0 #F4EFE3) drop-shadow(5px 0 0 #F4EFE3) drop-shadow(-5px 0 0 #F4EFE3) drop-shadow(0 5px 0 #F4EFE3) drop-shadow(0 -5px 0 #F4EFE3) drop-shadow(18px 26px 18px rgba(0,0,0,.35))}
.big{position:absolute;font:900 360px/0.86 'Playfair Display',serif;letter-spacing:-8px;color:transparent;-webkit-background-clip:text;background-clip:text;background-size:cover;background-position:center;white-space:nowrap}
.big.solid{color:#1C2A3A;-webkit-background-clip:border-box;background:none}
.serif{position:absolute;font:700 72px/1.05 'Playfair Display',serif;color:#1C2A3A}
.serif i{font-style:italic;color:#B3261E}
.lbl{position:absolute;font:800 46px Archivo,sans-serif;background:#E8602C;color:#FFF4E6;padding:10px 26px;box-shadow:6px 8px 0 rgba(0,0,0,.18);white-space:nowrap}
.hand{position:absolute;font:700 76px/1 'Caveat',cursive;color:#B3261E;white-space:nowrap}
.news{position:absolute;background:#F3EEE2;padding:34px 40px;box-shadow:12px 16px 0 rgba(0,0,0,.2);color:#1a1712}
.news .nn{font:700 32px 'Playfair Display';letter-spacing:.28em;text-align:center;border-bottom:3px double #1a1712;padding-bottom:8px}
.news .nd{font:600 20px Inter;text-align:center;color:#666;margin:8px 0 14px;letter-spacing:.15em}
.news .nt{font:900 92px/1.0 'Playfair Display',serif;margin-bottom:16px}
.news .nx{font:500 46px/1.4 Georgia,serif}
.news mark{background:linear-gradient(#F5D33F,#F5D33F) no-repeat 0 60%/0% 70%;color:inherit;padding:0 4px}
svg.ov{position:absolute;left:0;top:0;overflow:visible}
#subt{z-index:20;position:absolute;left:60px;right:60px;bottom:240px;text-align:center;font:700 46px/1.25 Inter,sans-serif;color:#fff;text-shadow:0 3px 0 #000,0 0 16px rgba(0,0,0,.8)}
#subt b{color:#F5D33F}
#cta{z-index:20;position:absolute;left:50%;bottom:110px;transform:translateX(-50%);font:800 40px Archivo;background:#1C2A3A;color:#F4EFE3;padding:16px 30px;white-space:nowrap;display:none}
#grain{z-index:21;position:absolute;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
#wipe{position:absolute;inset:0;pointer-events:none}
</style></head><body><div id="st"><div id="scenes"></div><div id="wipe"></div><div id="subt"></div><div id="cta">VÍDEO COMPLETO NO CANAL ▶</div><div id="grain"></div></div>
<script>
const CFG=__CFG__; const TL=CFG.tl; const S={}; TL.seg.forEach(s=>S[s.id]=s); const T0=CFG.ini, END=CFG.fim-CFG.ini;
const $=id=>document.getElementById(id); const cl=(x,a,b)=>Math.max(a,Math.min(b,x)); const ease=x=>{x=cl(x,0,1);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}; const eo=x=>1-Math.pow(1-cl(x,0,1),3);
const back=x=>{x=cl(x,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const IMG='A/'; const a=id=>S[id].a-T0;
function mk(t,c){const e=document.createElement(t); if(c) e.className=c; return e;}
// cena = {de, ate, camadas:[{tipo, ..., z(profundidade 0..1), at}]}
const CENAS=CFG.cenas.map(c=>Object.assign({},c,{de:c.de==='0'?0:a(c.de)-0.25, ate:c.ate==='FIM'?END+1:a(c.ate)-0.25}));
function build(){CENAS.forEach(c=>{const R=mk('div','sc'); R.innerHTML='<div class="paper"></div>'; c._R=R; $('scenes').appendChild(R);
 c.camadas.forEach(L=>{let d;
  if(L.tipo==='foto'){d=mk('div','ht '+(L.duo?'duo-'+L.duo:'')+(L.rasgado?' torn':'')); d.innerHTML=`<img src="${IMG+L.src}">`; d.style.cssText+=`left:${L.x}px;top:${L.y}px;width:${L.w}px;height:${L.h}px`;}
  else if(L.tipo==='recorte'){d=mk('img','cut'); d.src=IMG+L.src; d.style.cssText+=`left:${L.x}px;top:${L.y}px;width:${L.w}px`;}
  else if(L.tipo==='letras'){d=mk('div','big'+(L.src?'':' solid')); d.textContent=L.txt; if(L.src) d.style.backgroundImage=`url(${IMG+L.src})`; d.style.cssText+=`left:${L.x}px;top:${L.y}px;font-size:${L.size||360}px`; if(L.src) d.style.filter='contrast(1.1)';}
  else if(L.tipo==='serif'){d=mk('div','serif'); d.innerHTML=L.html; d.style.cssText+=`left:${L.x}px;top:${L.y}px;${L.size?'font-size:'+L.size+'px':''}`;}
  else if(L.tipo==='etiqueta'){d=mk('div','lbl'); d.innerHTML=L.txt; d.style.cssText+=`left:${L.x}px;top:${L.y}px`;}
  else if(L.tipo==='mao'){d=mk('div','hand'); d.innerHTML=L.txt; d.style.cssText+=`left:${L.x}px;top:${L.y}px`;}
  else if(L.tipo==='jornal'){d=mk('div','news torn'); d.style.cssText+=`left:${L.x}px;top:${L.y}px;width:${L.w}px`; d.innerHTML=`<div class="nn">${L.nome}</div><div class="nd">${L.data||''}</div><div class="nt">${L.titulo}</div><div class="nx">${L.texto}</div>`;}
  else if(L.tipo==='seta'||L.tipo==='traco'||L.tipo==='circulo'){d=mk('div'); d.innerHTML=`<svg class="ov" width="10" height="10"><path d="${L.d}" fill="none" stroke="${L.cor||'#B3261E'}" stroke-width="${L.esp||12}" stroke-linecap="round" stroke-linejoin="round" ${L.tipo==='traco'?'stroke-dasharray="26 22"':''} pathLength="1000"/></svg>`; d.style.cssText='position:absolute;left:0;top:0';}
  d.style.position='absolute'; R.appendChild(d); L._d=d;});});}
function arrowHead(d){return '';}
function render(t){let i=CENAS.findIndex(c=>t>=c.de&&t<c.ate); if(i<0) i=CENAS.length-1;
 CENAS.forEach((c,q)=>{c._R.style.display=(q===i||(q===i-1&&t-CENAS[i].de<0.45))?'':'none';});
 [i-1,i].forEach(q=>{if(q<0) return; const c=CENAS[q]; const u=t-c.de, dur=c.ate-c.de; const push=ease(u/Math.max(dur,1));
  if(q===i-1){const k=ease((t-CENAS[i].de)/0.45); c._R.style.clipPath=`polygon(0 0,100% 0,100% ${100-100*k}%,0 ${100-100*k+6}%)`; c._R.style.zIndex=2;} else {c._R.style.clipPath=''; c._R.style.zIndex=1;}
  c.camadas.forEach(L=>{const d=L._d, k=u-(L.at||0); const z=L.z!=null?L.z:0.5; if(k<0){d.style.opacity=0; return;} d.style.opacity=1;
   const sc=1+push*0.06*(0.4+z), dx=(c.pan||0)*push*80*z, dy=-push*30*z;
   let tr=`translate(${dx}px,${dy}px) scale(${sc})`, o=1;
   if(L.tipo==='recorte'){const p=back(cl(k/0.6,0,1)); tr+=` translateY(${(1-p)*200}px) rotate(${(L.rot||0)+Math.sin(u*1.3)*1.2}deg)`; o=cl(k/0.2,0,1);}
   else if(L.tipo==='letras'){const p=eo(k/0.7); tr+=` translateY(${(1-p)*120}px)`; d.style.clipPath=`inset(0 ${100-100*eo(k/0.9)}% 0 0)`;}
   else if(L.tipo==='serif'||L.tipo==='mao'){d.style.clipPath=`inset(0 ${100-100*cl(k/(L.tipo==='mao'?1.0:0.6),0,1)}% 0 0)`; tr+=` rotate(${L.rot||0}deg)`;}
   else if(L.tipo==='etiqueta'){const p=back(cl(k/0.4,0,1)); tr+=` scale(${p}) rotate(${L.rot||-4}deg)`;}
   else if(L.tipo==='jornal'){const p=eo(k/0.6); tr+=` translateY(${(1-p)*400}px) rotate(${(L.rot||-2)}deg)`; d.querySelectorAll('mark').forEach(m=>{m.style.backgroundSize=`${100*eo((k-(+m.dataset.at||1))/0.7)}% 70%`;});}
   else if(L.tipo==='foto'){const p=eo(k/0.6); o=p; tr+=` translateY(${(1-p)*60}px) rotate(${L.rot||0}deg)`;}
   else {const p=eo(k/(L.dur||0.8)); const pth=d.querySelector('path'); pth.setAttribute('stroke-dashoffset',L.tipo==='traco'?String(-u*40):String(1000-1000*p)); if(L.tipo==='traco') pth.style.clipPath=`inset(0 ${100-100*p}% 0 0)`; if(L.tipo!=='traco') pth.setAttribute('stroke-dasharray','1000 1000');}
   d.style.transform=tr; d.style.transformOrigin='50% 50%'; d.style.opacity=o;});});
 let st=''; TL.seg.forEach(q=>{if(q.txt&&t+T0>=q.a&&t+T0<q.b+0.2) st=q.txt;}); $('subt').textContent=st;
 const k=t-(END-3.2); $('cta').style.display=k>0?'block':'none'; $('cta').style.opacity=cl(k/0.4,0,1);
 $('grain').style.backgroundPosition=`${(Math.floor(t*8)*97)%300}px ${(Math.floor(t*8)*53)%300}px`;}
function preload(){const s=new Set(); CENAS.forEach(c=>c.camadas.forEach(L=>{if(L.src) s.add(IMG+L.src);})); return Promise.all([...s].map(u=>new Promise(r=>{const im=new Image(); im.onload=im.onerror=()=>r(); im.src=u;})));}
window.ready=Promise.all([preload(),document.fonts.ready]).then(()=>{build(); window.render=render; render(0); return 1;});
</script></body></html>
